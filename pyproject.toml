[project]
name = "pretix-withdrawal"
dynamic = ["version"]
description = "Support right of withdrawal from purchases to comply with EU legislation."
readme = "README.rst"
license = {file = "LICENSE"}
keywords = ["pretix"]
authors = [
    {name = "pretix team", email = "support@pretix.eu"},
]
maintainers = [
    {name = "pretix team", email = "support@pretix.eu"},
]

dependencies = [
]

[project.entry-points."pretix.plugin"]
pretix_withdrawal = "pretix_withdrawal:PretixPluginMeta"

[project.entry-points."distutils.commands"]
build = "pretix_plugin_build.build:CustomBuild"

[build-system]
requires = [
    "setuptools",
    "pretix-plugin-build",
]

[project.urls]
homepage = "https://github.com/pretix/pretix-withdrawal"
repository = "https://github.com/pretix/pretix-withdrawal.git"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "pretix_withdrawal.__version__"}

[tool.setuptools.packages.find]
include = ["pretix*"]
namespaces = false
